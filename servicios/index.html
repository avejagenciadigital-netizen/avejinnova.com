<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Web, chatbots con IA, automatizaciones, publicidad, redes sociales y Google para tu negocio. Calcula cuánto estás perdiendo en 2 minutos.">
<meta property="og:title" content="Servicios Turbo + Ventas · AVEJ Innova">
<meta property="og:description" content="Negocio que no está en internet, no existe. Calcula cuánto estás perdiendo y descubre qué necesita tu negocio.">
<meta property="og:url" content="https://avejinnova.com/servicios/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://avejinnova.com/img/img-01.webp">
<meta name="theme-color" content="#17181A">
<link rel="canonical" href="https://avejinnova.com/servicios/">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Servicios Turbo + Ventas · AVEJ Innova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Marca AVEJ Innova (avejinnova.com): grafito + cobre, Bebas Neue en títulos, Work Sans en texto, tarjetas de 6px con borde fino. Una sola apariencia oscura, igual que la web. */
:root{
  --bg:#17181A; --surface:#212320; --surface-2:#2A2C28; --line:#3A3C37;
  --ink:#F1EDE6; --ink-muted:#A6A297; --copper:#C9702F; --copper-dim:#8C4E22; --on-copper:#17181A;
  --honey:#C9702F;
  --ok:#7BBF6A; --warn:#E3A33B; --mid:#C9702F; --bad:#E2523A;
  --f-display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Work Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px}
.mono{font-family:var(--f-body);font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:.95}
h2{font-size:clamp(2rem,4.4vw,2.6rem)}
h3{font-family:var(--f-body);font-weight:700;font-size:1.12rem;line-height:1.35}
p{margin:0}
section{padding-block:clamp(44px,7vw,80px);border-top:1px solid var(--line)}
.sec-head{display:grid;gap:10px;max-width:62ch;margin-bottom:28px}
.sec-head p{color:var(--ink-muted)}

/* abeja */
.wing{fill:rgba(241,237,230,.28);stroke:var(--copper);stroke-width:1.2;transform-box:fill-box;transform-origin:50% 100%;animation:flap .11s ease-in-out infinite alternate}
.wing.w2{animation-delay:.05s}
.bee-body{fill:var(--copper);stroke:#E9A867;stroke-width:1.2}
.bee-ink{fill:none;stroke:#17181A;stroke-width:3.4;stroke-linecap:round}
.bee-line{fill:none;stroke:var(--copper);stroke-width:1.4;stroke-linecap:round}
.bee-head{fill:#8C4E22;stroke:var(--copper);stroke-width:1.2}
.bee-eye{fill:#F1EDE6}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand svg,.brand img{width:44px;height:32px;object-fit:contain}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.45rem;letter-spacing:.03em;line-height:1}
.brand b span{color:var(--copper)}
.region{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{font:600 .8rem var(--f-body);background:var(--surface);color:var(--ink-muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;transition:border-color .15s,color .15s}
.seg button:hover{color:var(--ink);border-color:var(--copper-dim)}
.seg button[aria-pressed="true"]{color:var(--copper);border-color:var(--copper)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(28px,5vw,52px);align-items:center;padding-block:36px 60px}
.hero-copy{display:grid;gap:20px;min-width:0}
.hero h1{font-size:clamp(3rem,7.2vw,4.6rem);letter-spacing:.02em}
.hero h1 mark{background:none;color:var(--copper);padding:0}
.lead{font-size:1.05rem;color:var(--ink-muted);max-width:50ch}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .98rem var(--f-body);text-decoration:none;padding:12px 18px;border:1px solid var(--copper);border-radius:6px;cursor:pointer;background:transparent;color:var(--copper);transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:rgba(201,112,47,.12)}
.btn.primary{background:var(--copper);color:var(--on-copper)}
.btn.primary:hover{background:#D9803C}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px}

/* plano */
figure.plan{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 14px 10px;min-width:0}
figure.plan figcaption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.plan svg{display:block;width:100%;height:auto;overflow:visible}
.plan .wall{fill:none;stroke:var(--ink);stroke-width:6}
.plan .part{fill:none;stroke:var(--ink-muted);stroke-width:2}
.plan .dim{stroke:var(--ink-muted);stroke-width:1;fill:none}
.plan .dimt{fill:var(--ink-muted);font:600 11px var(--f-body);letter-spacing:.08em}
.plan .room rect{fill:var(--surface);transition:fill .35s ease}
.plan .room .code{fill:var(--copper);font:600 11px var(--f-body);letter-spacing:.1em}
.plan .room .name{fill:var(--ink);font:400 22px var(--f-display);letter-spacing:.03em}
.plan .room .hint{fill:var(--ink-muted);font:400 11px var(--f-body)}
.plan .room:hover rect,.plan .room.visit rect{fill:rgba(201,112,47,.2)}
.plan .room:focus{outline:none}
.plan .room:focus-visible rect{stroke:var(--copper);stroke-width:3}
.plan .door{fill:none;stroke:var(--ink-muted);stroke-width:1.4}
.plan .gap{stroke:var(--surface);stroke-width:8}
#bee{pointer-events:none}

/* fichas */
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0;scroll-margin-top:24px;transition:border-color .2s}
.sheet:target,.sheet.pick{border-color:var(--copper)}
.sheet-top{display:flex;justify-content:space-between;gap:10px;padding:12px 16px 0}
.sheet-top .mono:first-child{color:var(--copper)}
.sheet-body{padding:10px 16px 16px;display:grid;gap:10px;align-content:start;flex:1}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:1.7rem;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.sheet .problem{color:var(--ink-muted);font-size:.95rem}
.sheet ul{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:7px}
.sheet li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:.93rem}
.sheet li::before{content:"";width:9px;height:10px;background:var(--copper);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:.45em}
.sheet-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line)}
.price{display:grid;justify-items:end;text-align:right;font-variant-numeric:tabular-nums}
.price .from{font:600 .68rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.price b{font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1;color:var(--copper);letter-spacing:.02em}
.price small{font-size:.8rem;color:var(--ink-muted)}

/* embudo */
.funnel{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
.wizard{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:grid;min-width:0}
.prog{position:relative;padding:16px 18px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.prog-row{display:flex;justify-content:space-between;gap:12px}
.track{position:relative;height:4px;background:var(--line);border-radius:4px;margin:16px 14px 4px 0}
.fill{position:absolute;inset:0 auto 0 0;background:var(--copper);border-radius:4px;transition:width .5s ease}
.rider{position:absolute;top:-26px;width:42px;height:34px;margin-left:-21px;transition:left .5s ease}
.step{padding:22px 18px;display:grid;gap:22px;align-content:start;min-height:330px}
.step h3{font-family:var(--f-display);font-weight:400;font-size:2rem;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.step .pain{color:var(--ink-muted);margin-top:-12px}
.field{display:grid;gap:10px}
.field > label,.field > .lbl{font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:500 .93rem var(--f-body);border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:10px 14px;cursor:pointer;text-align:left;transition:border-color .15s}
.opt:hover{border-color:var(--copper-dim)}
.opt[aria-pressed="true"]{border-color:var(--copper);color:var(--copper);background:rgba(201,112,47,.1)}
.range-row{display:flex;align-items:center;gap:14px}
.range-row input{flex:1;min-width:0;accent-color:var(--copper);height:28px}
.range-row output{font-family:var(--f-display);font-size:1.7rem;min-width:6.5ch;text-align:right;color:var(--copper);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.nav{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid var(--line)}
.nav .btn{padding:10px 16px}
.nav .btn[disabled]{opacity:.3;pointer-events:none}
.done-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.done-list li{display:flex;gap:10px;align-items:baseline}
.done-list li b{font-family:var(--f-display);font-weight:400;font-size:1.1rem;color:var(--copper)}
.done-list a{color:var(--copper)}

.result{background:var(--surface);color:var(--ink);border:1px solid var(--copper-dim);border-radius:6px;padding:22px 20px;display:grid;gap:16px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));min-width:0}
.loss{display:grid;gap:4px;text-align:center}
.loss b{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,6vw,3.4rem);line-height:1;color:var(--copper);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.loss span{color:var(--ink-muted);font-variant-numeric:tabular-nums}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.bars li{display:grid;gap:5px}
.bars .lab{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;font-variant-numeric:tabular-nums}
.bars .lab span:last-child{white-space:nowrap}
.bars .det{font-size:.8rem;color:var(--ink-muted)}
.bars .bar{height:4px;background:var(--line);border-radius:4px}
.bars .bar i{display:block;height:100%;background:var(--copper);border-radius:4px;transition:width .4s ease}
.bars li.top .lab span:first-child::after{content:attr(data-badge);margin-left:8px;font:600 .6rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--copper);color:var(--copper);border-radius:999px;padding:2px 7px;vertical-align:2px}
.priority{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.priority h3{font-family:var(--f-display);font-weight:400;font-size:1.8rem;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.priority a{color:var(--copper);font-size:.9rem}
.result .btn{background:var(--copper);color:var(--on-copper)}
.note{font-size:.76rem;color:var(--ink-muted)}

/* proceso y cierre */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.pstep{padding:18px;display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pstep .n{font-family:var(--f-display);font-size:2.4rem;color:var(--copper);line-height:1}
.pstep p{color:var(--ink-muted);font-size:.93rem}
.pay{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.84rem;background:var(--surface);color:var(--ink-muted)}
.close{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:28px;align-items:end}
.close h2{font-size:clamp(2.4rem,5.4vw,3.6rem)}
.contact{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:18px;display:grid;gap:12px}
.num{font-family:var(--f-display);font-size:2rem;letter-spacing:.03em;user-select:all;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn.small{padding:9px 14px;font-size:.9rem}
.contact a.mono{color:var(--copper);text-decoration:none}
.foot{padding-block:28px 40px;border-top:1px solid var(--line);display:grid;gap:8px;color:var(--ink-muted);font-size:.85rem}

/* estado del negocio: abeja con ánimo */
.mood{--s:120;--mc:var(--ok);display:grid;justify-items:center;text-align:center;gap:8px}
.mood[data-mood="forma"]{--s:120;--mc:var(--ok)}
.mood[data-mood="alerta"]{--s:150;--mc:var(--warn)}
.mood[data-mood="fuga"]{--s:180;--mc:var(--mid)}
.mood[data-mood="emergencia"]{--s:210;--mc:var(--bad)}
.mood svg{width:calc(var(--s) * 1px);max-width:100%;height:auto;transition:width .45s cubic-bezier(.3,1.4,.5,1);overflow:visible}
.mood.big svg{width:calc(var(--s) * 1.3px)}
.mood-name{font-family:var(--f-display);font-size:1.9rem;color:var(--mc);text-transform:uppercase;letter-spacing:.03em;line-height:1}
.mood.big .mood-name{font-size:2.3rem}
.mood-line{font-size:.93rem;max-width:34ch;color:var(--ink-muted)}
.mood .m{display:none}
.mood[data-mood="forma"] .m-forma,.mood[data-mood="alerta"] .m-alerta,.mood[data-mood="fuga"] .m-fuga,.mood[data-mood="emergencia"] .m-emergencia,
.mood[data-mood="alerta"] .m-eyes,.mood[data-mood="fuga"] .m-eyes,.mood[data-mood="fuga"] .m-drops,.mood[data-mood="emergencia"] .m-drops{display:inline}
.mood .disc{fill:color-mix(in srgb,var(--mc) 16%,transparent);stroke:color-mix(in srgb,var(--mc) 45%,transparent);stroke-width:1.5}
.mood .ring{fill:none;stroke:var(--bad);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ring 1s ease-out infinite}
.mood .mb{fill:var(--copper);stroke:#17181A;stroke-width:3}
.mood .mi{fill:#17181A}
.mood .ms{fill:none;stroke:#17181A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mood .mwh{fill:#F1EDE6;stroke:#17181A;stroke-width:2}
.mood .mdrop{fill:#7CC8FF;stroke:#17181A;stroke-width:1.5}
.mood .mcheek{fill:#E9A867;opacity:.6}
.mood .mw{fill:rgba(241,237,230,.3);stroke:var(--copper);stroke-width:2.5;transform-box:fill-box;transform-origin:50% 100%;animation:flap .14s ease-in-out infinite alternate}
.mood[data-mood="fuga"] .mw{animation-duration:.32s}
.mood[data-mood="emergencia"] .mw{animation-duration:.07s}
.mood .siren{fill:var(--bad);stroke:#17181A;stroke-width:2.5;animation:blink .55s steps(2) infinite}
.mood .rays{stroke:var(--bad);stroke-width:3;stroke-linecap:round;animation:blink .55s steps(2) infinite}
.mood .all{transform-box:fill-box;transform-origin:50% 60%}
.mood[data-mood="forma"] .all{animation:bob 2.4s ease-in-out infinite}
.mood[data-mood="alerta"] .all{animation:sway 1.6s ease-in-out infinite}
.mood[data-mood="fuga"] .all{animation:tremble .22s linear infinite}
.mood[data-mood="emergencia"] .all{animation:shake .32s linear infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes sway{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes tremble{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes shake{20%{transform:translate(-4px,1px) rotate(-3deg)}40%{transform:translate(4px,-1px) rotate(3deg)}60%{transform:translate(-3px,0) rotate(-2deg)}80%{transform:translate(3px,1px) rotate(2deg)}}
@keyframes blink{50%{opacity:.25}}
@keyframes ring{from{transform:scale(.85);opacity:.9}to{transform:scale(1.12);opacity:0}}
.result-step{display:grid;gap:18px}
.result-step .mood{border-bottom:1px solid var(--line);padding-bottom:18px}

@media (max-width:860px){
  .hero,.funnel,.close{grid-template-columns:minmax(0,1fr)}
  .result{position:static}
  .step{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bee-sym" viewBox="-30 -32 62 50">
    <ellipse class="wing" cx="-3" cy="-15" rx="8" ry="13"/>
    <ellipse class="wing w2" cx="7" cy="-14" rx="7" ry="11"/>
    <path class="bee-line" d="M-16 1 L-23 2.5 L-16 4"/>
    <ellipse class="bee-body" cx="0" cy="1" rx="16" ry="10"/>
    <path class="bee-ink" d="M-5 -7.5 Q-7 1 -5 9.5 M3 -8.2 Q1 1 3 10"/>
    <circle class="bee-head" cx="17" cy="-1" r="7"/>
    <circle class="bee-eye" cx="20" cy="-3" r="1.7"/>
    <path class="bee-line" d="M19 -7 Q22 -14 26 -15 M16 -7.5 Q17 -15 20 -18"/>
  </symbol>
</svg>

<div class="wrap">
  <header class="top">
    <div class="brand"><a href="/" aria-label="AVEJ Innova"><img src="/img/img-01.webp" alt="AVEJ"></a><b>AVEJ <span>INNOVA</span></b><span class="mono" data-i18n="brand_sub"></span></div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Idioma / Language">
        <button type="button" id="l-es" data-lang="es" aria-pressed="false">ES</button>
        <button type="button" id="l-en" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" id="l-fr" data-lang="fr" aria-pressed="false">FR</button>
        <button type="button" id="l-pt" data-lang="pt" aria-pressed="false">PT</button>
      </div>
    </div>
  </header>

  <div class="hero">
    <div class="hero-copy">
      <span class="mono" data-i18n="hero_eyebrow"></span>
      <h1 data-i18n-html="hero_h1"></h1>
      <p class="lead" data-i18n="hero_lead"></p>
      <div class="btns">
        <a class="btn primary" href="#diagnostico" data-i18n="cta_calc"></a>
        <a class="btn" href="#servicios" data-i18n="cta_services"></a>
      </div>
      <div class="facts">
        <span class="mono" data-i18n="f1"></span>
        <span class="mono" data-i18n="f2"></span>
        <span class="mono" data-i18n="f3"></span>
      </div>
    </div>

    <figure class="plan">
      <figcaption><span class="mono" data-i18n="plan_cap"></span><span class="mono" data-i18n="plan_tap"></span></figcaption>
      <svg viewBox="0 0 640 470" role="img" aria-label="AVEJ Innova">
        <path class="dim" d="M40 14 V24 M600 14 V24 M40 18 H600"/>
        <text class="dimt" x="320" y="12" text-anchor="middle">14,00 m</text>
        <path class="dim" d="M16 30 H26 M16 420 H26 M20 30 V420"/>
        <text class="dimt" x="12" y="225" text-anchor="middle" transform="rotate(-90 12 225)">9,75 m</text>

        <a href="#svc-web" class="room" data-room="web"><rect x="40" y="30" width="250" height="180"/>
          <text class="code" x="54" y="52">A-01</text><text class="name" x="165" y="135" text-anchor="middle" data-i18n="rm_web"></text><text class="hint" x="165" y="155" text-anchor="middle" data-i18n="rh_web"></text></a>

function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e) { return null; } }
// País elegido en "¿Desde dónde nos visitas?" de avejinnova.com (clave avej-pais) y región de precios (avej-region)
const PAIS = String(store("avej-pais") || "").toUpperCase();
const LATAM = ["CO","MX","VE","PE","CL","AR","EC","DO","PA","CR","GT","BO","UY","PY","HN","SV","NI","PR","CU","BR","LA","LATAM"];
const EUROPA = ["ES","FR","PT","EU","IT","DE","BE","CH","NL","GB","UK","IE","AT","LU"];
const LANG_BY_PAIS = {BR:"pt", PT:"pt", FR:"fr", BE:"fr", CH:"fr", LU:"fr", US:"en", CA:"en", GB:"en", UK:"en", IE:"en", ES:"es"};
const regionFromSite = (() => {
  const r = store("avej-region"); if (r && REGIONS[r]) return r;
  if (LATAM.includes(PAIS)) return "latam";
  if (EUROPA.includes(PAIS)) return "eu";
  if (PAIS === "US" || PAIS === "CA") return "us";
  return null;
})();
let lang = (()=>{
  try { const q = new URLSearchParams(location.search).get("lang"); if (q && LANGS.includes(q)) return q; } catch(e) {}
  const s = store("avej-lang"); if (s && LANGS.includes(s)) return s;
  if (LANG_BY_PAIS[PAIS]) return LANG_BY_PAIS[PAIS];
  if (LATAM.includes(PAIS)) return "es";
  const n = (navigator.language||"es").slice(0,2).toLowerCase();
  return LANGS.includes(n) ? n : "es";
})();
let region = regionFromSite || REGION_BY_LANG[lang];

const rLabel = () => t("r_"+region);

  const s = Math.round(n).toLocaleString(LOC[lang]);

/* ---------- RENDER ---------- */
function applyStatic(){
  document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.querySelectorAll(".room").forEach(r => r.setAttribute("aria-label", t("rm_"+r.dataset.room)));
  document.getElementById("wa-generic").href = `https://wa.me/${PHONE}?text=${encodeURIComponent(t("wa_generic"))}`;
}

function fieldHTML(f, st){
  const label = st.f[f.key];
  if (f.type === "choice"){
    const texts = f.key === "tipo" ? T().tipos : st.o[f.key];
    return `<div class="field"><span class="lbl" id="lb-${f.key}">${label}</span><div class="opts" role="group" aria-labelledby="lb-${f.key}">${
      f.vals.map((v,i)=>`<button type="button" class="opt" id="o-${f.key}-${i}" data-key="${f.key}" data-val="${v}" aria-pressed="${S[f.key]===v}">${texts[i]}</button>`).join("")}</div></div>`;
  }
  const suf = (st.s && st.s[f.key]) || "";
  const out = f.money ? fmt(S[f.key]) : `${S[f.key]}${suf}`;
  return `<div class="field"><label for="i-${f.key}">${label}</label><div class="range-row"><input type="range" id="i-${f.key}" data-key="${f.key}" min="${f.min}" max="${f.max}" step="${f.step}" value="${S[f.key]}"><output id="out-${f.key}">${out}</output></div></div>`;
}

function renderStep(){
  const cfg = CFG[cur], st = T().steps[cur], el = document.getElementById("step");
  if (cfg.result){
    const ranked = ranking().filter(p=>p.v>0);
    el.innerHTML = `<div class="result-step"><div class="mood big" id="mood-step" data-mood="forma"></div><h3>${t("result_title")}</h3>${ranked.length ? `<p class="pain">${t("result_intro")}</p>
      <ol class="done-list">${ranked.map((p,i)=>`<li><b>${String(i+1).padStart(2,"0")}</b><span>${T().pains[p.svc][0]} → <a href="#svc-${p.svc}">${svcName(p.svc)}</a></span></li>`).join("")}</ol>
      <p>${t("result_cta")}</p>` : `<p>${t("result_ok")}</p>`}</div>`;
    updateMood();
  } else {
    el.innerHTML = `<h3>${st.t}</h3>${st.p?`<p class="pain">${st.p}</p>`:""}${cfg.fields.map(f=>fieldHTML(f, st)).join("")}`;
  }
  const pct = cur/(CFG.length-1)*100;
  document.getElementById("fill").style.width = pct+"%";
  document.getElementById("rider").style.left = pct+"%";
  document.getElementById("step-label").textContent = t("step_of", {a:cur+1, b:CFG.length});
  document.getElementById("step-name").textContent = st.n;
  document.getElementById("back").disabled = cur===0;
  const nx = document.getElementById("next");
  nx.textContent = cur===CFG.length-2 ? t("see_result") : t("next");
  nx.hidden = !!cfg.result;
}

function ranking(){ return PAINS.map(p=>({...p, v:p.calc()})).sort((a,b)=>b.v-a.v); }

function renderResult(){
  const r = ranking(), total = r.reduce((a,p)=>a+p.v,0), max = Math.max(1, r[0].v);
  document.getElementById("loss-month").textContent = total ? `${fmt(total)} ${t("per_month")}` : fmt(0);
  document.getElementById("loss-year").textContent = total ? t("per_year", {x:fmt(total*12)}) : "";
  document.getElementById("bars").innerHTML = r.filter(p=>p.v>0).map((p,i)=>`
    <li class="${i===0?"top":""}" data-badge="${t("top_badge")}"><div class="lab"><span>${T().pains[p.svc][0]}</span><span>${fmt(p.v)}</span></div>
    <div class="bar"><i style="width:${(p.v/max*100).toFixed(1)}%"></i></div><span class="det">${T().pains[p.svc][1].replace("{n}", p.n())}</span></li>`).join("");
  const top = r[0];
  document.querySelectorAll(".sheet").forEach(s=>s.classList.toggle("pick", total>0 && s.id==="svc-"+top.svc));
  document.getElementById("priority").innerHTML = total>0
    ? `<span class="mono">${t("priority_label")}</span><h3>${svcName(top.svc)}</h3><a href="#svc-${top.svc}">${t("see_includes")}</a>`
    : `<h3>${t("ok_title")}</h3>`;
  document.getElementById("note").textContent = t("note", {r:rLabel(), t:fmt(S.ticket), h:fmt(REGIONS[region].hour)});
  const others = r.slice(1).filter(p=>p.v>0).map(p=>svcName(p.svc));
  const mk = moodKey();
  const lines = [t("wa_intro"), `${t("wa_business")}: ${T().tipos[S.tipo]}.`, `${t("wa_loss")}: ${fmt(total)} ${t("per_month")}.`, `${t("wa_status")}: ${T().moods[mk][0]}.`, `${t("wa_prio")}: ${svcName(top.svc)}.`];
  if (others.length) lines.push(`${t("wa_also")}: ${others.join(", ")}.`);
  lines.push(`${t("wa_region")}: ${rLabel()}. ${t("wa_ask")}`);
  document.getElementById("wa-cta").href = `https://wa.me/${PHONE}?text=${encodeURIComponent(lines.join("\n"))}`;
  updateMood();
}

function renderSheets(){
  document.getElementById("sheets").innerHTML = Object.entries(SVC).map(([id,s]) => {
    const [tag,name,problem,includes,time] = T().svc[id];
    return `<article class="sheet" id="svc-${id}">
      <div class="sheet-top"><span class="mono">${s.code}</span><span class="mono">${tag}</span></div>
      <div class="sheet-body"><h3>${name}</h3><p class="problem">${problem}</p><ul>${includes.map(i=>`<li>${i}</li>`).join("")}</ul></div>
      <div class="sheet-foot"><div><span class="mono">${t("deliver")}</span><br><span>${time}</span></div>
        <div class="price"><span class="from">${t("from")}</span><b>${fmt(s.price[IDX[region]])}</b><small>${t("u_"+s.unit)}</small></div></div>
    </article>`;}).join("");
}

/* ---------- ESTADO DEL NEGOCIO (abeja) ---------- */
const LEVELS = ["forma","alerta","fuga","emergencia"];
function moodKey(){
  const r = PAINS.map(p=>p.calc()), total = r.reduce((a,b)=>a+b,0);
  const lost = S.ticket ? total/S.ticket : 0, problems = r.filter(v=>v>0).length;
  let lvl = lost < 5 ? 0 : lost < 15 ? 1 : lost < 30 ? 2 : 3;
  if (problems >= 4) lvl = Math.max(lvl, 2);
  if (problems >= 6 && lost >= 15) lvl = 3;
  return LEVELS[lvl];
}

function updateMood(){
  const k = moodKey();
  ["mood-panel","mood-step"].forEach(id=>{
    const el = document.getElementById(id); if (!el) return;
    if (!el.firstChild) el.innerHTML = MOOD_SVG.replace(/CLIP/g, "clip-"+id);
    el.dataset.mood = k;
    el.querySelector(".mood-name").textContent = T().moods[k][0];
    el.querySelector(".mood-line").textContent = T().moods[k][1];
  });
}

/* ---------- EVENTOS ---------- */
const stepEl = document.getElementById("step");
stepEl.addEventListener("click", e => {
  const b = e.target.closest(".opt"); if (!b) return;
  S[b.dataset.key] = Number(b.dataset.val);
  b.parentElement.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed", String(o===b)));
  renderResult();
});
stepEl.addEventListener("input", e => {
  const i = e.target; if (!i.dataset || !i.dataset.key) return;
  const k = i.dataset.key; S[k] = Number(i.value);
  if (k==="ticket") touchedTicket = true;
  const f = CFG[cur].fields.find(x=>x.key===k), st = T().steps[cur];
  document.getElementById("out-"+k).textContent = f.money ? fmt(S[k]) : `${S[k]}${(st.s && st.s[k])||""}`;
  renderResult();
});
document.getElementById("next").addEventListener("click", ()=>{ if (cur<CFG.length-1){ cur++; renderStep(); }});
document.getElementById("back").addEventListener("click", ()=>{ if (cur>0){ cur--; renderStep(); }});

function renderAll(){
  if (!touchedTicket) S.ticket = REGIONS[region].ticket;
  applyStatic(); renderSheets(); renderStep(); renderResult();
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; store("avej-lang", lang);
  if (!regionFromSite) region = REGION_BY_LANG[lang];
  renderAll();
}));

document.getElementById("copy").addEventListener("click", e => {
  const btn = e.currentTarget;
  const reset = () => setTimeout(()=>btn.textContent=t("copy"),1800);
  const fallback = () => { const rg = document.createRange(); rg.selectNodeContents(document.getElementById("num")); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); btn.textContent = t("selected"); reset(); };
  try { navigator.clipboard.writeText("+573138287521").then(()=>{ btn.textContent = t("copied"); reset(); }, fallback); } catch(err) { fallback(); }
});

/* abeja que recorre el plano */
(function(){
  const bee = document.getElementById("bee"), flip = document.getElementById("bee-flip");
  const SPOTS = {web:[165,92], chatbot:[365,92], auto:[520,132], marketing:[140,282], redes:[340,272], google:[520,338]};
  const rooms = [...document.querySelectorAll(".room")];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const visit = id => rooms.forEach(r=>r.classList.toggle("visit", r.dataset.room===id));
  if (reduce){ visit("web"); return; }
  const order = Object.keys(SPOTS);
  let pos = {x:320, y:470}, target = "web", landed = false, timer = null, dir = 1;
  const go = id => { target = id; landed = false; visit(null); clearTimeout(timer); };
  const nextRoom = () => { const opts = order.filter(o=>o!==target); go(opts[Math.floor(Math.random()*opts.length)]); };
  rooms.forEach(r => { r.addEventListener("mouseenter", ()=>go(r.dataset.room)); r.addEventListener("focus", ()=>go(r.dataset.room)); });
  function tick(tm){
    const [tx,ty] = SPOTS[target], dx = tx-pos.x, dy = ty-pos.y, dist = Math.hypot(dx,dy);
    if (dist > 1.2){ pos.x += dx*0.04; pos.y += dy*0.04; if (Math.abs(dx)>2) dir = dx<0?-1:1; }
    else if (!landed){ landed = true; visit(target); timer = setTimeout(nextRoom, 2200); }
    const wob = landed ? Math.sin(tm/320)*1.5 : Math.sin(tm/85)*4;
    bee.setAttribute("transform", `translate(${pos.x.toFixed(1)} ${(pos.y+wob).toFixed(1)})`);
    flip.setAttribute("transform", `scale(${dir} 1)`);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
