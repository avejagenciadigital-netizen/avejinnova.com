      "2025-01-01","2025-01-20","2025-02-17","2025-04-18","2025-05-26",

    function isNYSEHoliday(ds) { return NYSE_HOLIDAYS.has(ds); }
    function isWeekday(d) { const day = d.getDay(); return day >= 1 && day <= 5; }
    function dateStr(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }

    function generateTradingDays(startDate, endDate, totalWeeks) {
      const days = [];
      let current = new Date(startDate);
      let weekDayCount = 0;
      let weekNum = 1;
      let weekDays = [];
      while (weekNum <= totalWeeks + 2) {
        if (current > endDate) {
          if (weekDays.length > 0) days.push({ week: weekNum, days: [...weekDays], partial: true });
          break;
        }
        if (isWeekday(current) && !isNYSEHoliday(dateStr(current))) {
          weekDays.push({ date: dateStr(current), dayOfWeek: current.getDay() });
          weekDayCount++;
          if (weekDayCount === 5) {
            days.push({ week: weekNum, days: [...weekDays], partial: false });
            weekDays = []; weekDayCount = 0; weekNum++;
          }
        }
        current = addDays(current, 1);
      }
      return days;
    }

    /* ─── ENGINE ─────────────────────────────────────────────────────────────── */
    function buildWeeks(weekSchedule, dailyActuals, initialBalance) {
      const result = [];
      let balance = initialBalance;
      let biAccum = 0, moAccum = 0;
      let totalDayIdx = 0;

      for (let wi = 0; wi < weekSchedule.length; wi++) {
        const wNum = wi + 1;
        const wDays = weekSchedule[wi].days;
        const weekDayData = [];
        let weekStartBalance = balance;
        let runBal = balance;

        for (let di = 0; di < wDays.length; di++) {
          const dayInfo = wDays[di];
          const key = `${wNum}_${di}`;
          const act = dailyActuals[key] || {};
          const isChecked = act.checked || false;
          const rawR = parseFloat(act.actualReturn);
          const actualReturn = isChecked && !isNaN(rawR) ? rawR : null;

          const dailyTarget = runBal * 0.10;
          const targetEnd   = runBal + dailyTarget;
          let achieved=null, achievedPct=null, diff=null, diffPct=null;

          if (actualReturn !== null) {
            achieved    = actualReturn;
            achievedPct = (actualReturn/runBal)*100;
            diff        = achieved - dailyTarget;
            diffPct     = dailyTarget>0 ? (diff/dailyTarget)*100 : 0;
          }

          const msg = getDailyMessage(totalDayIdx);
          weekDayData.push({
            dayNum:di+1, date:dayInfo.date, dayOfWeek:dayInfo.dayOfWeek,
            balance:runBal, dailyTarget, targetEnd,
            achieved, achievedPct, diff, diffPct,
            isChecked, msg, globalDayIdx:totalDayIdx,
          });

          const gain = actualReturn!==null ? achieved : dailyTarget;
          biAccum += gain; moAccum += gain;
          runBal = isChecked && actualReturn!==null ? runBal + achieved : targetEnd;
          totalDayIdx++;
        }

        const completedDays = weekDayData.filter(d=>d.isChecked&&d.achieved!==null);
        const weekActualGain = completedDays.reduce((s,d)=>s+(d.achieved||0),0);
        const weekTargetGain = weekDayData.reduce((s,d)=>s+d.dailyTarget,0);
        const weekActualPct  = weekStartBalance>0 ? (weekActualGain/weekStartBalance)*100 : 0;
        const weekGoalMet    = completedDays.length===wDays.length && weekActualPct>=50;

        const isBiweek = wNum%2===0;
        let biWithdrawal=0;
        if (isBiweek) { biWithdrawal=Math.max(0,biAccum)*0.10; biAccum=0; }

        const isMonthEnd = wNum%4===0;
        let moWithdrawal=0;
        if (isMonthEnd) { moWithdrawal=Math.max(0,moAccum)*0.20; moAccum=0; }

        const totalW = biWithdrawal+moWithdrawal;
        balance = runBal - totalW;

        const totalWeeks = weekSchedule.length;
        result.push({
          week:wNum, month:Math.ceil(wNum/4),
          startBalance:weekStartBalance,
          days:weekDayData,
          weekActualGain, weekTargetGain, weekActualPct,
          weekGoalMet,
          biWithdrawal, moWithdrawal, totalW,
          endBalance:balance,
          isBiweek, isMonthEnd,
          completedDays:completedDays.length,
          totalDays:wDays.length,
        });
      }
      return result;
    }

                  <div style={{fontSize:16,fontWeight:800,color:C.gold}}>{v}</div>
                  <div style={{fontSize:9,color:C.dimmed,marginTop:2}}>{l}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       MAIN APP
    ═══════════════════════════════════════════════════════════════════════════ */
    function App() {
      const [store, setStore] = useState(loadStore);
      const [showSetup, setShowSetup] = useState(false);
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [tab, setTab]     = useState("dashboard");
      const [expWeek, setExpWeek] = useState(null);
      const [expDay, setExpDay]   = useState(null);
      const [expM, setExpM]       = useState(null);
      const [showBadge, setShowBadge] = useState(null);
      const [withdrawModal, setWithdrawModal] = useState(null);
      const [toast, setToast] = useState(null);

      const cfg = store.config || null;

      useEffect(() => { saveStore(store); }, [store]);

      const showToast = useCallback((msg, color="#d4a843") => {
        setToast({msg,color}); setTimeout(()=>setToast(null), 2800);
      }, []);

      function handleSaveConfig(newCfg) {
        setStore(prev => ({ ...prev, config: newCfg }));
        setShowSetup(false);
        showToast("✓ Configuración guardada", "#00e676");
      }

      function handleFullReset() {
        const fresh = defaultStore();
        setStore(fresh);
        setShowResetConfirm(false);
        setShowSetup(false);
        setTab("dashboard");
        showToast("🔄 Campaña reiniciada desde cero", "#f48fb1");
      }

      // If not configured yet, show setup
      if (!cfg && !showSetup) {
        return <SetupScreen onSave={handleSaveConfig}/>;
      }
      if (showSetup) {
        return <SetupScreen existing={cfg} onSave={handleSaveConfig}/>;
      }

      // Build from config
      const startDate  = new Date(cfg.startDate);
      const endDate    = new Date(cfg.endDate);
      const totalWeeks = cfg.totalWeeks;
      const initialBalance = cfg.initialBalance;

      const weekSchedule = useMemo(
        () => generateTradingDays(startDate, endDate, totalWeeks),
        [cfg.startDate, cfg.endDate, cfg.totalWeeks]
      );
      const weeks = useMemo(
        () => buildWeeks(weekSchedule, store.dailyActuals, initialBalance),
        [weekSchedule, store.dailyActuals, initialBalance]
      );

      const allCompletedDays = weeks.flatMap(w=>w.days.filter(d=>d.isChecked&&d.achieved!==null));
      const completedWeeks   = weeks.filter(w=>w.weekGoalMet);
      const lastWeekWithData = [...weeks].reverse().find(w=>w.completedDays>0);
      const curBal           = lastWeekWithData ? lastWeekWithData.endBalance : initialBalance;

      const avgDayPct = allCompletedDays.length>0
        ? allCompletedDays.reduce((s,d)=>s+(d.achievedPct||0),0)/allCompletedDays.length
        : 10;
      const avgWeekPct = avgDayPct*5;
      const gameLvl = getGamificationLevel(curBal);
      const nextM   = MILESTONES.find(m=>curBal<m.amount);
      const greenWeeksCount = completedWeeks.length;
      const earnedBadges = WEEK_BADGES.filter(b=>greenWeeksCount>=b.weeks);

      const totalBiConfirmed = (store.withdrawals.biweekly||[]).filter(w=>w.confirmed).reduce((s,w)=>s+w.amount,0);
      const totalMoConfirmed = (store.withdrawals.monthly||[]).filter(w=>w.confirmed).reduce((s,w)=>s+w.amount,0);
      const pendingBi = (store.withdrawals.biweekly||[]).filter(w=>!w.confirmed).reduce((s,w)=>s+w.amount,0);
      const pendingMo = (store.withdrawals.monthly||[]).filter(w=>!w.confirmed).reduce((s,w)=>s+w.amount,0);

      function updateDaily(weekNum, dayIdx, field, value) {
        const key = `${weekNum}_${dayIdx}`;
        setStore(prev => ({
          ...prev,
          dailyActuals:{...prev.dailyActuals,[key]:{...(prev.dailyActuals[key]||{}),[field]:value}}
        }));
      }

      function handleConfirmWithdrawal(w) {
        setStore(prev=>{
          const type = w.type==="biweekly" ? "biweekly" : "monthly";
          const list = (prev.withdrawals[type]||[]).map(x=>
            x.id===w.id ? {...x,confirmed:true,confirmedAt:new Date().toISOString()} : x
          );
          return {...prev,withdrawals:{...prev.withdrawals,[type]:list}};
        });
        showToast(`✓ Retiro de ${fmt(w.amount)} confirmado`, "#00e676");
        setWithdrawModal(null);
      }

      useEffect(() => {
        weeks.forEach(week => {
          if (week.completedDays===week.totalDays&&week.totalDays>0) {
            if (week.isBiweek && week.biWithdrawal>0) {
              const exists = (store.withdrawals.biweekly||[]).find(w=>w.weekNum===week.week);
              if (!exists) {
                setStore(prev=>({...prev,withdrawals:{...prev.withdrawals,
                  biweekly:[...(prev.withdrawals.biweekly||[]),{
                    id:`bi_${week.week}`,weekNum:week.week,amount:week.biWithdrawal,confirmed:false,confirmedAt:null,
                  }]
                }}));
              }
            }
            if (week.isMonthEnd && week.moWithdrawal>0) {
              const exists = (store.withdrawals.monthly||[]).find(w=>w.weekNum===week.week);
              if (!exists) {
                setStore(prev=>({...prev,withdrawals:{...prev.withdrawals,
                  monthly:[...(prev.withdrawals.monthly||[]),{
                    id:`mo_${week.week}`,weekNum:week.week,amount:week.moWithdrawal,confirmed:false,confirmedAt:null,
                  }]
                }}));
              }
            }
          }
        });
      }, [weeks]);

      useEffect(() => {
        const lastBadge = earnedBadges[earnedBadges.length-1];
        if (lastBadge) {
          const key = `badge_shown_${lastBadge.id}`;
          if (!store[key]) {
            setShowBadge(lastBadge);
            setStore(prev=>({...prev,[key]:true}));
          }
        }
      }, [greenWeeksCount]);

      function weeksTo(target) {
        if (avgWeekPct<=0) return 9999;
        return Math.ceil(Math.log(target/curBal)/Math.log(1+avgWeekPct/100));
      }
      function weeksToTime(w) {
        if(!isFinite(w)||w<=0) return "—";
        const m=Math.floor(w/4), s=Math.round(w%4);
        if(m===0) return `${s} sem`;
        if(s===0) return `${m} meses`;
        return `${m}m ${s}sem`;
      }

      const TABS = [
        {id:"dashboard",label:"📊"},
        {id:"daily",    label:"📅"},
        {id:"etapas",   label:"🏆"},
        {id:"retiros",  label:"💸"},
        {id:"stats",    label:"📈"},
        {id:"logros",   label:"🎖️"},
      ];

      const C = {
        bg:"#080808", card:"#0d0d0d", cardGold:"linear-gradient(135deg,#1a1200,#0d0d0d)",
        gold:"#d4a843", goldB:"#ffe066", silver:"#c0c8d8",
        text:"#e8eef6", muted:"#8898aa", dimmed:"#556070",
        green:"#00e676", red:"#ff5252", amber:"#ffb74d",
      };
      const card = (extra={}) => ({
        background:C.card, border:"1px solid rgba(255,255,255,0.07)", borderRadius:16, ...extra,
      });
      const goldCard = (extra={}) => ({
        background:C.cardGold, border:"1px solid rgba(212,168,67,0.4)",
        borderRadius:16, boxShadow:"0 0 20px rgba(212,168,67,0.1)", ...extra,
      });

      const todayMsg = getDailyMessage(Math.floor(Date.now()/86400000)%DAILY_MESSAGES.length);
      const isAhead = avgWeekPct > 50 && allCompletedDays.length > 0;
      const numMonths = Math.ceil(totalWeeks / 4);

      return (
        <div style={{minHeight:"100vh",background:C.bg,backgroundImage:"radial-gradient(ellipse 80% 30% at 50% 0%,rgba(212,168,67,0.05) 0%,transparent 70%)",fontFamily:"'DM Sans','Helvetica',sans-serif",color:C.text,paddingBottom:80}}>

          {/* TOAST */}
          {toast && (
            <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:999,
              background:"#111",border:`1px solid ${toast.color}`,borderRadius:12,padding:"10px 20px",
              fontSize:13,color:toast.color,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,0.8)",whiteSpace:"nowrap"}}>{toast.msg}</div>
          )}

          {/* BADGE MODAL */}
          {showBadge && (
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:900,display:"flex",alignItems:"center",justifyContent:"center"}}
              onClick={()=>setShowBadge(null)}>
              <div style={{...goldCard({padding:32,maxWidth:320,width:"90%",textAlign:"center"})}} onClick={e=>e.stopPropagation()}>
                <div style={{fontSize:60,marginBottom:8}}>{showBadge.icon}</div>
                <div style={{fontSize:10,letterSpacing:3,color:C.gold,textTransform:"uppercase",marginBottom:6}}>¡INSIGNIA DESBLOQUEADA!</div>
                <div style={{fontSize:22,fontWeight:800,color:"#fff",fontFamily:"Georgia,serif",marginBottom:8}}>{showBadge.name}</div>
                <GoldLine/>
                <div style={{fontSize:13,color:C.muted,marginTop:8}}>{showBadge.desc}</div>
                <button onClick={()=>setShowBadge(null)} style={{marginTop:20,width:"100%",padding:"12px",background:"linear-gradient(90deg,#d4a843,#ffe066)",border:"none",borderRadius:10,fontWeight:800,fontSize:14,color:"#000",cursor:"pointer"}}>¡A por la siguiente! 🚀</button>
              </div>
            </div>
          )}

          {/* RESET CONFIRM MODAL */}
          {showResetConfirm && (
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:900,display:"flex",alignItems:"center",justifyContent:"center"}}
              onClick={()=>setShowResetConfirm(false)}>
              <div style={{...card({padding:28,maxWidth:320,width:"90%",border:"1px solid rgba(255,82,82,0.4)"}),background:"rgba(20,0,0,0.98)"}} onClick={e=>e.stopPropagation()}>
                <div style={{fontSize:36,textAlign:"center",marginBottom:12}}>⚠️</div>
                <div style={{fontSize:16,fontWeight:800,textAlign:"center",marginBottom:8}}>Reiniciar campaña</div>
                <div style={{fontSize:12,color:C.muted,textAlign:"center",lineHeight:1.6,marginBottom:20}}>
                  Se borrarán <strong style={{color:"#fff"}}>todos los datos registrados</strong>: días marcados, retiros confirmados e insignias. Podrás configurar una nueva campaña desde cero.
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setShowResetConfirm(false)} style={{flex:1,padding:"12px",background:"transparent",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,color:C.muted,cursor:"pointer",fontSize:13}}>Cancelar</button>
                  <button onClick={handleFullReset} style={{flex:2,padding:"12px",background:"linear-gradient(90deg,#c62828,#ff5252)",border:"none",borderRadius:10,fontWeight:800,fontSize:13,color:"#fff",cursor:"pointer"}}>🔄 Sí, reiniciar todo</button>
                </div>
              </div>
            </div>
          )}

          {/* WITHDRAWAL MODAL */}
          {withdrawModal && (
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:900,display:"flex",alignItems:"center",justifyContent:"center"}}
              onClick={()=>setWithdrawModal(null)}>
              <div style={{...card({padding:24,maxWidth:320,width:"90%",border:"1px solid rgba(0,230,118,0.3)"}),}} onClick={e=>e.stopPropagation()}>
                <div style={{fontSize:10,letterSpacing:3,color:C.green,textTransform:"uppercase",marginBottom:12}}>Confirmar Retiro</div>
                <div style={{fontSize:13,color:C.muted,marginBottom:8}}>{withdrawModal.type==="biweekly"?"⬡ Retiro Quincenal (10%)":"◆ Reinversión Mensual (20%)"}</div>
                <div style={{fontSize:32,fontWeight:800,color:C.gold,fontFamily:"Georgia,serif",marginBottom:4}}>{fmt(withdrawModal.amount)}</div>
                <div style={{fontSize:11,color:C.dimmed,marginBottom:16}}>Semana {withdrawModal.weekNum}</div>
                <GoldLine/>
                <div style={{fontSize:12,color:C.muted,margin:"12px 0",lineHeight:1.6}}>
                  Al confirmar, este retiro quedará registrado como <strong style={{color:"#fff"}}>ejecutado</strong>.
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setWithdrawModal(null)} style={{flex:1,padding:"11px",background:"transparent",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,color:C.muted,cursor:"pointer",fontSize:13}}>Cancelar</button>
                  <button onClick={()=>handleConfirmWithdrawal(withdrawModal)} style={{flex:2,padding:"11px",background:"linear-gradient(90deg,#00c853,#00e676)",border:"none",borderRadius:10,fontWeight:800,fontSize:13,color:"#000",cursor:"pointer"}}>✓ Confirmar Retiro</button>
                </div>
              </div>
            </div>
          )}

          {/* HEADER */}
          <div style={{background:"rgba(6,4,0,0.97)",borderBottom:"1px solid rgba(212,168,67,0.18)",padding:"12px 14px 10px",position:"sticky",top:0,zIndex:200}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <Logo size={40}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:7,letterSpacing:3,color:C.muted,textTransform:"uppercase"}}>CAMPAÑA ACTIVA</div>
                <div style={{fontSize:15,fontWeight:800,letterSpacing:1,textTransform:"uppercase",lineHeight:1.1,
                  background:"linear-gradient(90deg,#ffe066,#d4a843,#fff8e1,#b8860b)",
                  WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
                  overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",
                }}>{cfg.campaignName}</div>
                <div style={{fontSize:8,color:C.dimmed,marginTop:1}}>{cfg.startDate} → {cfg.endDate} · {cfg.totalWeeks} sem</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:7,color:C.dimmed,letterSpacing:1}}>BALANCE</div>
                  <div style={{fontSize:16,fontWeight:800,color:C.green,fontFamily:"Georgia,serif"}}>{fmt(curBal)}</div>
                  <div style={{fontSize:8,color:gameLvl.color,fontWeight:700}}>{gameLvl.name}</div>
                </div>
                <div style={{display:"flex",gap:4}}>
                  <button onClick={()=>setShowSetup(true)} title="Editar configuración" style={{
                    width:28,height:28,borderRadius:7,background:"rgba(212,168,67,0.1)",
                    border:"1px solid rgba(212,168,67,0.3)",color:C.gold,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",
                  }}>⚙</button>
                  <button onClick={()=>setShowResetConfirm(true)} title="Reiniciar campaña" style={{
                    width:28,height:28,borderRadius:7,background:"rgba(255,82,82,0.08)",
                    border:"1px solid rgba(255,82,82,0.25)",color:"#ff5252",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",
                  }}>↺</button>
                </div>
              </div>
            </div>
            {gameLvl.next && (
              <div style={{marginTop:7}}>
                <div style={{height:3,background:"rgba(255,255,255,0.06)",borderRadius:2,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${Math.min(100,(curBal/gameLvl.next)*100)}%`,background:`linear-gradient(90deg,${gameLvl.color}88,${gameLvl.color})`,borderRadius:2,transition:"width 0.5s"}}/>
                </div>
              </div>
            )}
          </div>

          {/* TAB BAR */}
          <div style={{display:"flex",background:"rgba(0,0,0,0.6)",borderBottom:"1px solid rgba(212,168,67,0.12)",overflowX:"auto",scrollbarWidth:"none"}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{
                flex:"1 0 auto",padding:"11px 6px",border:"none",background:"transparent",cursor:"pointer",
                fontSize:18,borderBottom:tab===t.id?"2px solid #d4a843":"2px solid transparent",
                opacity:tab===t.id?1:0.45,transition:"all 0.2s",
              }}>{t.label}</button>
            ))}
          </div>

          <div style={{padding:12}}>

          {/* ══════════ DASHBOARD ══════════ */}
          {tab==="dashboard" && (
            <div style={{display:"flex",flexDirection:"column",gap:12}}>

              <div style={{...card({padding:14,border:`1px solid ${MSG_TYPE_COLOR[todayMsg.type]}33`})}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                  <div style={{fontSize:24,flexShrink:0}}>{todayMsg.icon}</div>
                  <div>
                    <div style={{fontSize:8,letterSpacing:2,color:MSG_TYPE_COLOR[todayMsg.type],textTransform:"uppercase",marginBottom:4,fontWeight:700}}>
                      {todayMsg.type==="quote"?"FRASE CÉLEBRE":todayMsg.type==="tip"?"CONSEJO DEL DÍA":todayMsg.type==="mindset"?"MINDSET":"ENERGÍA"}
                    </div>
                    <div style={{fontSize:13,color:C.text,lineHeight:1.5,fontStyle:todayMsg.type==="quote"?"italic":"normal"}}>
                      "{todayMsg.text}"
                    </div>
                    {todayMsg.author && <div style={{fontSize:10,color:C.gold,marginTop:4,fontWeight:600}}>— {todayMsg.author}</div>}
                  </div>
                </div>
              </div>

              <div style={{...goldCard({padding:18})}}>
                <div style={{fontSize:8,letterSpacing:3,textTransform:"uppercase",color:C.muted,marginBottom:2,fontWeight:600}}>PATRIMONIO</div>
                <div style={{fontSize:32,fontWeight:800,fontFamily:"Georgia,serif",
                  background:"linear-gradient(90deg,#ffe066,#d4a843,#fff8e1)",
                  WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",lineHeight:1,
                }}>{fmtFull(curBal)}</div>
                <GoldLine/>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:8}}>
                  {[
                    {l:"Capital inicial",v:fmt(initialBalance),c:C.muted},
                    {l:"Ganancia",v:fmt(curBal-initialBalance),c:C.gold},
                    {l:"ROI",v:fmtPct(((curBal-initialBalance)/initialBalance)*100),c:C.green},
                  ].map((k,i)=>(
                    <div key={i} style={{textAlign:"center"}}>
                      <div style={{fontSize:15,fontWeight:800,color:k.c,fontFamily:"Georgia,serif"}}>{k.v}</div>
                      <div style={{fontSize:8,color:C.dimmed,letterSpacing:1,textTransform:"uppercase",marginTop:2}}>{k.l}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{...card({padding:14,background:isAhead?"rgba(0,20,5,0.9)":"rgba(20,10,0,0.9)",
                border:`1px solid ${isAhead?"rgba(0,230,118,0.3)":"rgba(212,168,67,0.35)"}`})}}>
                <div style={{fontSize:9,letterSpacing:2,color:isAhead?C.green:C.gold,textTransform:"uppercase",fontWeight:700,marginBottom:10}}>
                  {isAhead?"▲ RITMO ADELANTADO":"◆ RITMO EN SEGUIMIENTO"} · {allCompletedDays.length} días completados
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                  {[
                    {l:"Diario real",v:fmtPct(avgDayPct),c:avgDayPct>=10?C.green:C.red},
                    {l:"Semanal real",v:fmtPct(avgWeekPct),c:avgWeekPct>=50?C.green:C.red},
                    {l:"vs Meta",v:fmtPct(avgWeekPct-50),c:avgWeekPct>=50?C.green:C.red},
                  ].map((k,i)=>(
                    <div key={i} style={{textAlign:"center",background:"rgba(0,0,0,0.4)",borderRadius:10,padding:"10px 6px"}}>
                      <div style={{fontSize:16,fontWeight:800,color:k.c,fontFamily:"Georgia,serif"}}>{k.v}</div>
                      <div style={{fontSize:8,color:C.dimmed,marginTop:3,letterSpacing:1,textTransform:"uppercase"}}>{k.l}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{...card({padding:14,border:`1px solid ${gameLvl.color}44`,background:`linear-gradient(135deg,${gameLvl.color}08,#0d0d0d)`})}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:44,height:44,borderRadius:12,background:`${gameLvl.color}22`,border:`1px solid ${gameLvl.color}55`,
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:900,color:gameLvl.color,fontFamily:"Georgia,serif"}}>
                    {gameLvl.level}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:9,color:C.muted,letterSpacing:2,textTransform:"uppercase"}}>NIVEL ACTUAL</div>
                    <div style={{fontSize:18,fontWeight:800,color:gameLvl.color}}>{gameLvl.name}</div>
                    {gameLvl.next && (
                      <>
                        <div style={{fontSize:10,color:C.dimmed,marginTop:2}}>{fmt(gameLvl.next-curBal)} para subir de nivel</div>
                        <div style={{height:4,background:"rgba(255,255,255,0.06)",borderRadius:2,marginTop:6,overflow:"hidden"}}>
                          <div style={{height:"100%",width:`${Math.min(100,(curBal/gameLvl.next)*100)}%`,background:gameLvl.color,borderRadius:2,transition:"width 0.5s"}}/>
                        </div>
                      </>
                    )}
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:9,color:C.dimmed}}>Insignias</div>
                    <div style={{fontSize:22,fontWeight:800,color:C.gold}}>{earnedBadges.length}</div>
                    <div style={{fontSize:9,color:C.dimmed}}>de {WEEK_BADGES.length}</div>
                  </div>
                </div>
              </div>

              {nextM && (()=>{
                const tc=TIER_CLR[nextM.tier], pct=Math.min(100,(curBal/nextM.amount)*100), wks=weeksTo(nextM.amount);
                return (
                  <div style={{...card({padding:14,background:`linear-gradient(135deg,${tc}08,#0d0d0d)`,border:`1px solid ${tc}33`})}}>
                    <div style={{fontSize:8,letterSpacing:2,color:C.muted,textTransform:"uppercase",marginBottom:10}}>PRÓXIMA CONQUISTA</div>
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <div style={{width:40,height:40,borderRadius:10,background:`${tc}22`,border:`1px solid ${tc}44`,
                        display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>{nextM.emoji}</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:14,fontWeight:700,color:"#fff"}}>{nextM.label} — {fmt(nextM.amount)}</div>
                        <div style={{fontSize:11,color:C.dimmed,marginTop:2}}>Falta <span style={{color:tc,fontWeight:600}}>{fmt(nextM.amount-curBal)}</span> · ~{weeksToTime(wks)}</div>
                        <div style={{height:5,background:"rgba(255,255,255,0.06)",borderRadius:3,marginTop:8,overflow:"hidden"}}>
                          <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${tc}66,${tc})`,boxShadow:`0 0 8px ${tc}66`,borderRadius:3,transition:"width 0.5s"}}/>
                        </div>
                        <div style={{fontSize:10,color:tc,marginTop:4,fontWeight:600}}>{fmtPct(pct)} completado</div>
                      </div>
                    </div>
                  </div>
                );

                      </div>
                      <div style={{display:"flex",gap:8,alignItems:"center"}}>
                        <div style={{fontSize:15,fontWeight:800,color:C.gold,fontFamily:"Georgia,serif"}}>{fmt(w.amount)}</div>
                        <button onClick={()=>setWithdrawModal({...w,type:"monthly"})} style={{padding:"6px 12px",background:"rgba(212,168,67,0.12)",border:"1px solid rgba(212,168,67,0.4)",borderRadius:8,color:C.gold,fontSize:11,cursor:"pointer",fontWeight:700}}>Confirmar</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              <div style={{fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,padding:"2px 0"}}>HISTORIAL CONFIRMADO</div>
              {[...(store.withdrawals.biweekly||[]).filter(w=>w.confirmed).map(w=>({...w,type:"biweekly"})),
                ...(store.withdrawals.monthly||[]).filter(w=>w.confirmed).map(w=>({...w,type:"monthly"}))
              ].sort((a,b)=>a.weekNum-b.weekNum).map((w,i)=>(
                <div key={i} style={{...card({padding:13})}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:700}}>{w.type==="biweekly"?"⬡ Retiro Quincenal":"◆ Reinversión Mensual"}</div>
                      <div style={{fontSize:10,color:C.dimmed,marginTop:2}}>Semana {w.weekNum} · {w.confirmedAt?new Date(w.confirmedAt).toLocaleDateString("es"):""}</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:16,fontWeight:800,color:w.type==="biweekly"?C.silver:C.gold,fontFamily:"Georgia,serif"}}>{fmt(w.amount)}</div>
                      <div style={{fontSize:9,color:C.green,fontWeight:600}}>✓ Confirmado</div>
                    </div>
                  </div>
                </div>
              ))}
              {(store.withdrawals.biweekly||[]).filter(w=>w.confirmed).length===0&&
               (store.withdrawals.monthly||[]).filter(w=>w.confirmed).length===0 && (
                <div style={{...card({padding:24,textAlign:"center"})}}>
                  <div style={{fontSize:28,marginBottom:8}}>◆</div>
                  <div style={{fontSize:11,color:C.dimmed}}>Aún no hay retiros confirmados</div>
                </div>
              )}
            </div>
          )}

          {/* ══════════ STATS ══════════ */}
          {tab==="stats" && (
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div style={{...card({padding:14})}}>
                <div style={{fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:12}}>RENDIMIENTO DIARIO %</div>
                <div style={{position:"relative",height:90}}>
                  <div style={{position:"absolute",top:"50%",left:0,right:0,borderTop:"1px dashed rgba(212,168,67,0.3)"}}>
                    <span style={{position:"absolute",right:0,top:-10,fontSize:8,color:C.gold}}>10%</span>
                  </div>
                  <div style={{display:"flex",alignItems:"flex-end",height:"100%",gap:1,overflowX:"auto",paddingBottom:12}}>
                    {weeks.flatMap(w=>w.days).map((d,i)=>{
                      const pct=d.isChecked&&d.achievedPct?d.achievedPct:0;
                      const bH=d.isChecked?Math.max(2,(pct/20)*100):2;
                      return (
                        <div key={i} style={{flex:"0 0 auto",width:8}}>
                          <div style={{height:`${bH}%`,minHeight:2,borderRadius:"2px 2px 0 0",
                            background:d.isChecked?(pct>=10?"linear-gradient(180deg,#ffe066,#d4a843)":"linear-gradient(180deg,#ff6b6b,#8b0000)"):"rgba(255,255,255,0.05)",
                            boxShadow:d.isChecked&&pct>=10?"0 0 4px rgba(212,168,67,0.5)":"none"}}/>
                          {i%5===0&&<div style={{fontSize:6,color:"#334",textAlign:"center"}}>S{Math.floor(i/5)+1}</div>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div style={{...card({padding:14})}}>
                <div style={{fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:12}}>RENDIMIENTO SEMANAL %</div>
                <div style={{position:"relative",height:80}}>
                  <div style={{position:"absolute",top:"50%",left:0,right:0,borderTop:"1px dashed rgba(212,168,67,0.3)"}}>
                    <span style={{position:"absolute",right:0,top:-9,fontSize:8,color:C.gold}}>50%</span>
                  </div>
                  <div style={{display:"flex",alignItems:"flex-end",height:"100%",gap:3}}>
                    {weeks.map((w,i)=>{
                      const bH=w.completedDays>0?Math.max(2,(w.weekActualPct/100)*100):2;
                      return (
                        <div key={i} style={{flex:1}}>
                          <div style={{height:`${bH}%`,minHeight:2,borderRadius:"2px 2px 0 0",
                            background:w.completedDays>0
                              ?(w.weekGoalMet?"linear-gradient(180deg,#ffe066,#d4a843)":"linear-gradient(180deg,#ff6b6b,#8b0000)")
                              :"rgba(255,255,255,0.05)",
                            boxShadow:w.weekGoalMet?"0 0 6px rgba(212,168,67,0.4)":"none"}}/>
                          {i%4===0&&<div style={{fontSize:7,color:"#334",textAlign:"center"}}>M{Math.floor(i/4)+1}</div>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div style={{...card({padding:14})}}>
                <div style={{fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:12}}>TIEMPO A CADA ETAPA</div>
                {MILESTONES.map(m=>{
                  const tc=TIER_CLR[m.tier], reached=curBal>=m.amount;
                  const pct=Math.min(100,(curBal/m.amount)*100), wks=reached?0:weeksTo(m.amount);
                  return (
                    <div key={m.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:m.id<8?"1px solid rgba(255,255,255,0.04)":"none"}}>
                      <span style={{fontSize:14,flexShrink:0}}>{m.emoji}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",justifyContent:"space-between"}}>
                          <span style={{fontSize:11,color:reached?tc:"#c0c8d8",fontWeight:reached?700:400}}>{m.label}</span>
                          <span style={{fontSize:11,color:tc,fontWeight:700}}>{reached?"✦":weeksToTime(wks)}</span>
                        </div>
                        <div style={{height:3,background:"rgba(255,255,255,0.05)",borderRadius:2,marginTop:5,overflow:"hidden"}}>
                          <div style={{height:"100%",width:`${pct}%`,background:reached?tc:`${tc}88`,borderRadius:2}}/>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div style={{...goldCard({padding:14})}}>
                <div style={{fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:12}}>ESTADÍSTICAS GLOBALES</div>
                {[
                  ["Campaña", cfg.campaignName],
                  ["Período", `${cfg.startDate} → ${cfg.endDate}`],
                  ["Total semanas", cfg.totalWeeks],
                  ["Capital Inicial", fmtFull(initialBalance)],
                  ["Balance Actual", fmtFull(curBal)],
                  ["Ganancia", fmtFull(curBal-initialBalance)],
                  ["ROI", fmtPct(((curBal-initialBalance)/initialBalance)*100)],
                  ["Rend. prom. diario", fmtPct(avgDayPct)],
                  ["Rend. prom. semanal", fmtPct(avgWeekPct)],
                  ["Días completados", `${allCompletedDays.length} / ${totalWeeks*5}`],
                  ["Semanas en verde", `${completedWeeks.length} / ${totalWeeks}`],
                  ["Nivel actual", gameLvl.name],
                  ["Insignias ganadas", `${earnedBadges.length} / ${WEEK_BADGES.length}`],
                  ["Retiros confirmados", fmtFull(totalBiConfirmed+totalMoConfirmed)],
                  ["Próxima etapa", nextM?nextM.label:"¡Todas logradas!"],
                ].map(([l,v],i,arr)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<arr.length-1?"1px solid rgba(255,255,255,0.04)":"none"}}>
                    <span style={{fontSize:11,color:C.muted}}>{l}</span>
                    <span style={{fontSize:11,fontWeight:700,color:C.text}}>{v}</span>
                  </div>
                ))}
              </div>

              {/* Botones de gestión en Stats */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <button onClick={()=>setShowSetup(true)} style={{
                  padding:"14px",background:"rgba(212,168,67,0.1)",border:"1px solid rgba(212,168,67,0.3)",
                  borderRadius:12,color:C.gold,cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"'DM Sans',sans-serif",
                }}>⚙ Editar config</button>
                <button onClick={()=>setShowResetConfirm(true)} style={{
                  padding:"14px",background:"rgba(255,82,82,0.08)",border:"1px solid rgba(255,82,82,0.25)",
                  borderRadius:12,color:"#ff5252",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"'DM Sans',sans-serif",
                }}>↺ Nueva campaña</button>
              </div>
            </div>
          )}

          {/* ══════════ LOGROS ══════════ */}
          {tab==="logros" && (
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <div style={{...card({padding:16,border:`1px solid ${gameLvl.color}44`,background:`linear-gradient(135deg,${gameLvl.color}08,#0d0d0d)`})}}>
                <div style={{textAlign:"center",marginBottom:12}}>
                  <div style={{fontSize:9,letterSpacing:3,textTransform:"uppercase",color:C.muted,marginBottom:4}}>NIVEL DE TRADER</div>
                  <div style={{fontSize:48,fontWeight:900,color:gameLvl.color,fontFamily:"Georgia,serif",lineHeight:1}}>{gameLvl.level}</div>
                  <div style={{fontSize:22,fontWeight:800,color:"#fff",marginTop:4}}>{gameLvl.name}</div>
                  {gameLvl.next && <div style={{fontSize:11,color:C.muted,marginTop:4}}>Siguiente nivel: {fmt(gameLvl.next)}</div>}
                </div>
                <GoldLine/>
                <div style={{marginTop:10,display:"flex",gap:10}}>
                  {[
                    {l:"Días OK",v:allCompletedDays.length,c:C.green},
                    {l:"Semanas Verde",v:completedWeeks.length,c:C.gold},
                    {l:"Insignias",v:earnedBadges.length,c:C.silver},
                  ].map((k,i)=>(
                    <div key={i} style={{flex:1,textAlign:"center",background:"rgba(0,0,0,0.4)",borderRadius:10,padding:"10px 6px"}}>
                      <div style={{fontSize:22,fontWeight:800,color:k.c,fontFamily:"Georgia,serif"}}>{k.v}</div>
                      <div style={{fontSize:8,color:C.dimmed,marginTop:3,letterSpacing:1,textTransform:"uppercase"}}>{k.l}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{...card({padding:14})}}>
                <div style={{fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:12}}>INSIGNIAS</div>
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {WEEK_BADGES.map(b=>{
                    const earned=greenWeeksCount>=b.weeks;
                    return (
                      <div key={b.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px",borderRadius:12,
                        background:earned?"rgba(212,168,67,0.06)":"rgba(255,255,255,0.02)",
                        border:`1px solid ${earned?"rgba(212,168,67,0.3)":"rgba(255,255,255,0.06)"}`,
                        boxShadow:earned?"0 0 12px rgba(212,168,67,0.1)":"none",opacity:earned?1:0.4}}>
                        <div style={{width:44,height:44,borderRadius:12,flexShrink:0,
                          background:earned?"linear-gradient(135deg,#1a1200,#2a1a00)":"rgba(255,255,255,0.04)",
                          border:`1px solid ${earned?"rgba(212,168,67,0.4)":"rgba(255,255,255,0.07)"}`,
                          display:"flex",alignItems:"center",justifyContent:"center",fontSize:earned?22:16,filter:earned?"none":"grayscale(1)"}}>
                          {earned?b.icon:"🔒"}
                        </div>
                        <div style={{flex:1}}>
                          <div style={{fontSize:13,fontWeight:700,color:earned?"#fff":"#556070"}}>{b.name}</div>
                          <div style={{fontSize:10,color:C.dimmed,marginTop:2}}>{b.desc}</div>
                          <div style={{fontSize:9,color:earned?C.gold:C.dimmed,marginTop:3,fontWeight:600}}>
                            {earned?"✦ OBTENIDA":`Requiere ${b.weeks} sem. en verde · Actual: ${greenWeeksCount}`}
                          </div>
                        </div>
                        {earned && <div style={{fontSize:18}}>✦</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
