<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visite virtuelle · Xuixo · AVEJ Innova</title>
<meta name="description" content="Visite virtuelle du projet d’aménagement de Xuixo (Céret) par AVEJ Innova : terrasse, salle et patio.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#141414; --panel:#1F1E1C; --line:#36322E; --ink:#F3ECE2; --muted:#A99F93;
  --copper:#B87A4B; --copper2:#D9A877; --blue:#2B3A6E; --red:#C8102E; --gold:#F2B705;
  --display:'Lora',Georgia,serif; --label:'Poppins',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;overflow:hidden}
img{max-width:100%}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:3px solid transparent;
  border-image:linear-gradient(90deg,var(--blue) 0 33%,var(--red) 33% 66%,var(--gold) 66%) 1}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.04em;line-height:1.1}
.brand span{font-family:var(--label);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--copper2)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.toggle button{all:unset;cursor:pointer;font-family:var(--label);font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--copper);color:#fff}
.toggle button:focus-visible{outline:2px solid var(--copper2);outline-offset:2px}
.toggle[hidden]{display:none!important}
.stage{position:relative;overflow:hidden;cursor:grab;touch-action:none;background:#000}
.stage.drag{cursor:grabbing}
.pano{position:absolute;left:0;top:0;will-change:transform}
.pano img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease}
.pano img.alt,.pano img.antes{opacity:0}
.stage.blanc .pano img.alt{opacity:1}
.stage.hoy .pano img.antes{opacity:1}
.stage.hoy .hs{display:none!important}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
.fade.on{opacity:1}
.hs{all:unset;cursor:pointer;position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px}
.hs .dot{width:34px;height:34px;border-radius:50%;background:rgba(184,122,75,.94);border:2px solid #fff;display:grid;place-items:center;
  box-shadow:0 0 0 0 rgba(184,122,75,.6);animation:pulse 2.2s infinite}
.hs .dot svg{width:16px;height:16px;fill:#fff}
.hs .lab{background:rgba(20,20,20,.86);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
.hs:focus-visible .dot{outline:3px solid var(--copper2);outline-offset:3px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,122,75,.55)}70%{box-shadow:0 0 0 14px rgba(184,122,75,0)}100%{box-shadow:0 0 0 0 rgba(184,122,75,0)}}
.badge{position:absolute;right:12px;bottom:12px;font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:rgba(20,20,20,.78);border:1px solid var(--line);padding:5px 10px;border-radius:999px;color:var(--copper2)}
.stage.hoy .badge::after{content:" · aujourd’hui";color:var(--muted)}
.info{background:var(--panel);border-top:1px solid var(--line);padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.info .k{font-family:var(--label);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--copper2);font-weight:600}
.info h2{font-family:var(--display);font-weight:600;font-size:22px;margin:2px 0 3px;line-height:1.15}
.info p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink);max-width:80ch}
.app.hoy .info .k::after{content:" · état actuel";color:var(--muted)}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink);background:rgba(20,20,20,.75);
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);transition:opacity .6s;white-space:nowrap}
.hint.off{opacity:0}
nav{display:flex;gap:8px;overflow-x:auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-top:1px solid var(--line);background:var(--bg)}
nav button{all:unset;cursor:pointer;flex:0 0 auto;width:120px;border-radius:8px;overflow:hidden;border:2px solid transparent;background:var(--panel)}
nav button img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
nav button span{display:block;font-size:11.5px;font-weight:600;padding:5px 7px;color:var(--muted)}
nav button[aria-current="true"]{border-color:var(--copper)}
nav button[aria-current="true"] span{color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--copper2);outline-offset:2px}
.credit{flex:0 0 auto;align-self:center;font-size:11px;color:var(--muted);padding-left:6px;line-height:1.4;text-decoration:none}
.credit b{color:var(--copper);font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.14em}
@media (max-width:560px){
  .brand b{font-size:20px}.toggle button{padding:6px 10px}
  .hs .lab{font-size:12px}
  .brand span{display:none}
  .info{padding-block:8px}.info h2{font-size:19px}.info p{font-size:12.5px;line-height:1.4}
  .hint{font-size:11px}
  nav button{width:96px}
}
@media (prefers-reduced-motion:reduce){.hs .dot{animation:none}.pano img,.fade{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>Xuixo · Céret</b><span>Visite virtuelle · Phase 1 · AVEJ Innova</span></div>
    <div class="ctl">
      <div class="toggle" id="tg-plafond" role="group" aria-label="Plafond" hidden>
        <button id="btn-noir" aria-pressed="true">Plafond noir</button>
        <button id="btn-blanc" aria-pressed="false">Plafond blanc</button>
      </div>
      <div class="toggle" role="group" aria-label="Comparer">
        <button id="btn-prop" aria-pressed="true">Projet</button>
        <button id="btn-hoy" aria-pressed="false">Aujourd’hui</button>
      </div>
    </div>
  </header>
  <main class="stage" id="stage" aria-label="Visionneuse de la visite">
    <div class="pano" id="pano">
      <img id="img-prop" alt="">
      <img id="img-alt" class="alt" alt="">
      <img id="img-hoy" class="antes" alt="">
      <div id="hotspots"></div>
    </div>
    <div class="fade" id="fade"></div>
    <div class="badge">Vue 3D · ambiance</div>
    <div class="hint" id="hint">Faites glisser pour regarder · touchez les points</div>
  </main>
  <section class="info" aria-live="polite"><div class="k" id="info-k"></div><h2 id="info-h"></h2><p id="info-p"></p></section>
  <nav id="nav" aria-label="Scènes"></nav>
</div>
<script>
const T='tour/';
const ARROW='<svg viewBox="0 0 24 24"><path d="M8 4l8 8-8 8z"/></svg>';
const SCENES={
  terrasse:{n:'1',name:'Terrasse',img:T+'terrasse.webp',hoy:T+'f05.webp',
    text:'Façade en bleu cosmique Tollens EE105, store conservé, guirlandes et lampadaires. Sur le plan : 8 tables et 32 places dans la zone jaune tolérée, arbre et passage piétons dégagés.',
    hs:[{x:47,y:50,to:'salle',label:'Entrer'}]},
  salle:{n:'2',name:'Salle et cuisine ouverte',img:T+'sala_noir.webp',alt:T+'sala_blanc.webp',hoy:T+'f19.webp',
    text:'Pas de mur : on voit la braise depuis la salle. Trois comptoirs en portes anciennes sculptées, table haute, maillots rouge et or, têtes de lampadaires vertes récupérées. Comparez le plafond noir (recommandé) et le blanc.',
    hs:[{x:52,y:42,to:'patio',label:'Vers le patio'},{x:14,y:70,to:'entree',label:'Se retourner'}]},
  entree:{n:'3',name:'Salle vers l’entrée',img:T+'sala_contre.webp',hoy:T+'f13.webp',
    text:'Le comptoir et la cuisine vus depuis le patio : tabourets Tolix, écran sur le pilier, tables bistrot le long du mur de pierre et, au fond, le couloir qui mène à la place.',
    hs:[{x:52,y:47,to:'terrasse',label:'Vers la place'},{x:80,y:80,to:'salle',label:'Se retourner'}]},
  patio:{n:'4',name:'Patio sous la treille',img:T+'patio.webp',hoy:T+'f11.webp',
    text:'La treille déjà installée, couverte de plantes. Écran pour les matchs, fléchettes, ardoises, deux tonneaux et les chaises Windsor blanches. Sur le plan : 50 places.',
    hs:[{x:50,y:78,to:'soir',label:'Se retourner'},{x:12,y:62,to:'salle',label:'Vers la salle'}]},
  soir:{n:'5',name:'Patio en soirée',img:T+'patio_contre.webp',hoy:T+'f_patio2.webp',
    text:'Le même patio vu dans l’autre sens, à la tombée de la nuit : mur corten habillé de bois et de souvenirs, guirlandes allumées, climatiseurs voisins masqués par la végétation.',
    hs:[{x:50,y:80,to:'patio',label:'Se retourner'},{x:20,y:66,to:'salle',label:'Vers la salle'}]}
};
const ORDER=['terrasse','salle','entree','patio','soir'];
const $=id=>document.getElementById(id);
const stage=$('stage'),pano=$('pano'),imgP=$('img-prop'),imgA=$('img-alt'),imgH=$('img-hoy'),hsBox=$('hotspots'),fade=$('fade');
let cur=null,ax='x',off=0,maxOff=0,dragging=false,sx=0,sy=0,so=0,lastMove=Date.now(),dir=1,aspect=4/3;
const ZOOM=1.12;
function layout(){
  const w=stage.clientWidth,h=stage.clientHeight;
  let pw,ph;
  if(w/h>aspect){pw=w*ZOOM;ph=pw/aspect}else{ph=h*ZOOM;pw=ph*aspect}
  pano.style.width=pw+'px';pano.style.height=ph+'px';
  const ox=pw-w,oy=ph-h; ax=oy>ox?'y':'x'; maxOff=Math.max(ox,oy);
  pano.dataset.cx=ax==='x'?-(oy/2):-(ox/2);
  off=Math.max(-maxOff,Math.min(0,off));apply();
}
function apply(){
  const c=+pano.dataset.cx||0;
  pano.style.transform=ax==='x'?`translate(${off}px,${c}px)`:`translate(${c}px,${off}px)`;
}
function plafond(blanc){
  stage.classList.toggle('blanc',blanc);
  $('btn-blanc').setAttribute('aria-pressed',blanc);$('btn-noir').setAttribute('aria-pressed',!blanc);
}
function show(key,instant){
  if(key===cur)return;
  const s=SCENES[key];
  const go=()=>{
    cur=key;
    const im=new Image();im.src=s.img;
    const set=()=>{aspect=(im.naturalWidth/im.naturalHeight)||aspect;layout();off=-maxOff/2;apply()};
    im.complete?set():im.onload=set;
    imgP.src=s.img;imgP.alt=`Projet : ${s.name}`;
    imgA.src=s.alt||s.img;imgA.alt=s.alt?`Projet, plafond blanc : ${s.name}`:'';
    imgH.src=s.hoy;imgH.alt=`Aujourd’hui : ${s.name}`;
    $('tg-plafond').hidden=!s.alt; if(!s.alt)plafond(false);
    hsBox.innerHTML='';
    s.hs.forEach(h=>{
      const b=document.createElement('button');
      b.className='hs';b.style.left=h.x+'%';b.style.top=h.y+'%';
      b.innerHTML=`<span class="dot">${ARROW}</span><span class="lab">${h.label}</span>`;
      b.addEventListener('click',e=>{e.stopPropagation();show(h.to)});
      b.addEventListener('pointerdown',e=>e.stopPropagation());
      hsBox.appendChild(b);
    });
    $('info-k').textContent=`Scène ${s.n} sur ${ORDER.length}`;
    $('info-h').textContent=s.name;
    $('info-p').textContent=s.text;
    document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.k===key));
    try{if(window.top===window)history.replaceState(null,'','#'+key)}catch(e){}
    requestAnimationFrame(()=>fade.classList.remove('on'));
  };
  if(instant||!cur){go();return}
  fade.classList.add('on');setTimeout(go,330);
}
const nav=$('nav');
ORDER.forEach(k=>{
  const s=SCENES[k],b=document.createElement('button');
  b.dataset.k=k;b.innerHTML=`<img src="${s.img}" alt="" loading="lazy"><span>${s.n} · ${s.name}</span>`;
  b.addEventListener('click',()=>show(k));nav.appendChild(b);
});
const cr=document.createElement('a');cr.className='credit';
cr.href='https://avejinnova.com/';cr.target='_top';cr.rel='noopener';
cr.innerHTML='<b>AVEJ INNOVA</b><br>Interior Design &amp; Smart Furniture<br>@avej.innova';nav.appendChild(cr);
const pos=e=>ax==='x'?e.clientX:e.clientY;
stage.addEventListener('pointerdown',e=>{dragging=true;sx=pos(e);so=off;stage.classList.add('drag');lastMove=Date.now();$('hint').classList.add('off')});
window.addEventListener('pointermove',e=>{if(!dragging)return;off=Math.max(-maxOff,Math.min(0,so+(pos(e)-sx)));apply();lastMove=Date.now()});
window.addEventListener('pointerup',()=>{dragging=false;stage.classList.remove('drag')});
window.addEventListener('pointercancel',()=>{dragging=false;stage.classList.remove('drag')});
window.addEventListener('keydown',e=>{
  const back=ax==='x'?'ArrowLeft':'ArrowUp',fwd=ax==='x'?'ArrowRight':'ArrowDown';
  if(e.key===back){off=Math.min(0,off+60);apply();lastMove=Date.now()}
  if(e.key===fwd){off=Math.max(-maxOff,off-60);apply();lastMove=Date.now()}
});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function drift(){
  if(!reduce&&!dragging&&Date.now()-lastMove>2500){
    off+=dir*0.25;
    if(off<=-maxOff){off=-maxOff;dir=1} if(off>=0){off=0;dir=-1}
    apply();
  }
  requestAnimationFrame(drift);
}
function mode(hoy){
  stage.classList.toggle('hoy',hoy);document.querySelector('.app').classList.toggle('hoy',hoy);
  $('btn-hoy').setAttribute('aria-pressed',hoy);$('btn-prop').setAttribute('aria-pressed',!hoy);
}
$('btn-hoy').addEventListener('click',()=>mode(true));
$('btn-prop').addEventListener('click',()=>mode(false));
$('btn-blanc').addEventListener('click',()=>plafond(true));
$('btn-noir').addEventListener('click',()=>plafond(false));
window.addEventListener('resize',layout);
layout();
const start=(location.hash||'').slice(1);
show(SCENES[start]?start:'terrasse',true);
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(SCENES[k])show(k)});
drift();
setTimeout(()=>$('hint').classList.add('off'),6000);
</script>
</body>
</html>
